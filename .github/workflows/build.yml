name: Build Radion APK
on: { push: { branches: [main, master] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o RadionApp.zip -d .
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - run: cd RadionApp && chmod +x gradlew || true
      - run: cd RadionApp && gradle wrapper --gradle-version 8.7 && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: radion-apk, path: RadionApp/app/build/outputs/apk/debug/app-debug.apk }
